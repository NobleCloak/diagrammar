diagrammar: 1
type: flowchart
title: Order fulfilment
direction: down
layout: dagre

groups:
  - id: fulfilment
    label: Fulfilment

nodes:
  - id: start
    label: Order received
    shape: oval
    in: fulfilment
    description: |
      Submitted via web or MCP.
    style:
      fill: '#eef'
  - id: check
    label: Check stock
    in: fulfilment
