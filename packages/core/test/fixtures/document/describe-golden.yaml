diagrammar: 1
type: flowchart
title: Order fulfilment
direction: down

groups:
  - id: fulfilment
    label: Fulfilment

nodes:
  - id: start
    label: Order received
    shape: oval
    in: fulfilment
    description: |
      Submitted via web or MCP.
    style:
      fill: "#eef"
  - id: check
    label: Check stock
    in: fulfilment
  - id: ship
    label: Ship order
    in: fulfilment

edges:
  - { from: start, to: check }
  - { id: yes, from: check, to: ship, label: "yes", style: { dashed: true } }

notes:
  - id: n1
    at: check
    side: right
    width: 240
    text: Checks the reservation ledger, not raw stock.

callouts:
  - id: c1
    at: yes
    number: 1
    text: Happy path continues here.

views:
  - id: happy
    title: Happy path
    focus: [start, check, ship, yes]
